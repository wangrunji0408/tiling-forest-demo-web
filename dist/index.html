<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#29463c"><title>Tiling Forest · Web</title><link rel="icon" href="assets/world/common/image/logo/forest/2.png"><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="world" aria-label="森林拼图地图，拖动移动视角，点击空格放置图块"></canvas>
<div id="titleScreen"><div class="title-card"><div id="logo" aria-label="Tiling Forest"></div><p class="subtitle">— Tiling Town Demo —</p><div class="title-actions"><button id="continue">继续游戏</button><button id="start">开始游戏</button><button id="titleRules">游戏规则</button></div><p class="edition">浏览器移植版 · 原版地图与像素资源</p></div><div class="credit">Tiling Forest / Tiling Town © muratsubo Games · 原作版权归原作者所有</div></div>
<div id="gameUI" hidden>
 <header><button id="menuBtn" title="菜单">☰</button><div class="heading"><strong>森林</strong><span id="progress">0 / 35</span></div><div class="headActions"><button id="guideBtn">指南 <kbd>G</kbd></button><button id="rulesBtn">规则 <kbd>H</kbd></button><button id="soundBtn" title="开启声音">♫</button><button id="fullBtn" title="全屏">⛶</button></div></header>
 <aside id="areaPanel"><div class="area-title"><span id="areaName">W-1</span><span id="areaState">未完成</span></div><div id="areaChecks"></div><div class="area-buttons"><button id="resetArea" title="清空当前区域">重置 <kbd>C</kbd></button><button id="loadArea" title="恢复完成时的布局">加载布局</button></div></aside>
 <div class="camera-controls"><button id="overview" title="森林全景">▦</button><button id="home" title="返回起点">⌂</button><button id="zoomOut" title="缩小 Q">−</button><span id="zoomLabel">200%</span><button id="zoomIn" title="放大 E">＋</button></div>
 <nav id="tools"><button id="handBtn" title="拖动地图 Esc">✥<span>移动</span></button><button id="tileBtn" class="active" title="放置图块">▦<span>图块</span></button><button id="markBtn" title="备忘标记">⚑<span>标记</span></button><i></i><button id="undoBtn" title="撤销 Z">↶<span>撤销</span></button><button id="redoBtn" title="重做 X">↷<span>重做</span></button></nav>
 <section id="palettePanel"><div class="palette-title"><span id="paletteCaption">拥有的图块</span><span id="tileCount"></span><button id="collapsePalette" title="收起 / 展开 Tab">⌄</button></div><div id="palette"></div></section>
 <footer><span id="instruction">左键 放置 · 右键 移除 · 滚轮 切换图块 · 拖动 / WASD 移动</span><span id="saveStatus">自动保存</span></footer>
 <div id="toast" role="status"></div><div id="reward" hidden></div>
</div>
<dialog id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="关闭">×</button></div><div id="modalBody"></div></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script type="module" src="app.js"></script>
</body></html>
